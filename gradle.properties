# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build in parallel and reuse cached outputs (faster builds, especially on CI).
org.gradle.parallel=true
org.gradle.caching=true

# REQUIRED for every AndroidX / Jetpack library: resolves "androidx.*" instead
# of the legacy "android.support.*" namespace.
android.useAndroidX=true

# Recommended by Google: each module only sees the resources it declares itself.
android.nonTransitiveRClass=true

# NOTE: "android.enableJetifier" is intentionally NOT set. It is only needed when
# a dependency still pulls in the old Support Library, which is not the case here.
