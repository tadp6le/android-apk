// Top-level build file: configuration common to all sub-projects/modules.
plugins {
    // Android Gradle Plugin - AGP 8.5.x requires Gradle 8.7+ and JDK 17.
    id 'com.android.application' version '8.5.2' apply false

    // This app is pure Java, so no Kotlin plugin is required.
    // If you add Kotlin sources later, uncomment the line below and also apply
    // 'org.jetbrains.kotlin.android' in app/build.gradle:
    // id 'org.jetbrains.kotlin.android' version '2.0.20' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
